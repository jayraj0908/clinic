<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailz — Signing you in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f0ead8;--dim:#77777c;--line:rgba(240,234,216,.09);--glass:rgba(13,13,15,.88)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#050506;font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;padding:36px;background:var(--glass);border:1px solid var(--line);border-radius:16px;margin:20px;text-align:center}
  .boat{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8e8,#d9c78f 60%,#8f7658);margin:0 auto 18px}
  h1{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin:0 0 14px}
  p{font:500 12px 'Inter';color:var(--dim);line-height:1.6}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(240,234,216,.2);border-top-color:var(--ink);
    animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="boat"></div>
  <h1>Sailz</h1>
  <p><span class="spinner"></span>Signing you in…</p>
</div>
<script>
const token=location.pathname.split('/').pop();
(async()=>{
  try{
    const res=await fetch('/api/auth/magic/consume',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||"This link isn't valid.");
    sessionStorage.setItem('token',data.token);
    if(data.mustChangePassword) sessionStorage.setItem('mustChangePassword','1');
    else sessionStorage.removeItem('mustChangePassword');
    location.href='/';
  }catch(e){
    document.getElementById('card').innerHTML=`<div class="boat"></div><h1>Sailz</h1><p>${e.message}</p>`;
  }
})();
</script>
</body>
</html>
