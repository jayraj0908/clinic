<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sailz — Shine Dental Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/force-graph@1/dist/force-graph.min.js"></script>
<style>
  :root{
    --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F4F4F2; --border:#E7E6E3;
    --ink:#17171A; --ink-2:#52514E; --muted:#8A8A86;
    --black:#111111; --good:#17A34A; --warning:#D9A441; --critical:#E5484D;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Archivo,sans-serif;overflow:hidden}
  .mono{font-family:'IBM Plex Mono',monospace}
  .hidden{display:none!important}
  button{font-family:'IBM Plex Mono',monospace;cursor:pointer;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:11px;font-weight:600;padding:7px 14px}
  button:hover{background:var(--surface-2)}
  button.primary{background:var(--black);border-color:var(--black);color:#fff}
  button:focus-visible{outline:2px solid var(--black);outline-offset:2px}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #login .card{width:100%;max-width:380px;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-top:6px;background:var(--surface-2);color:var(--ink)}
  label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .field{margin-bottom:16px}

  /* app shell */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;pointer-events:none}
  #topbar > *{pointer-events:auto}
  #topbar .brand{font-weight:800;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  #topbar .brand .mark{width:28px;height:28px;border-radius:50%;background:linear-gradient(160deg,#1E3A8A,#0EA5E9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  #topbar .brand .powered{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.04em}
  #topbar .right{display:flex;gap:10px;align-items:center}
  #topbar a.ghost-link{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none}
  #topbar a.ghost-link:hover{color:var(--ink)}
  #topbar .stats{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}

  #graph{position:absolute;inset:0}
  #tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.12);opacity:0;transition:opacity .15s ease;z-index:20;white-space:nowrap}

  /* inspector panel */
  #inspector{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-20px 0 60px rgba(0,0,0,.08);transform:translateX(100%);transition:transform .2s cubic-bezier(.25,.8,.25,1);z-index:15;overflow-y:auto}
  #inspector.open{transform:translateX(0)}
  #inspector .head{padding:24px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start}
  #inspector .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
  #inspector h2{font-size:18px;font-weight:800}
  #inspector .status-row{display:flex;align-items:center;gap:6px;margin-top:4px}
  #inspector .status-dot{width:7px;height:7px;border-radius:50%}
  #inspector .status-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  #inspector .close{margin-left:auto;background:none;border:none;color:var(--muted);font-size:20px;padding:2px 6px;line-height:1}
  #inspector .section{padding:20px 24px;border-bottom:1px solid var(--border)}
  #inspector .section:last-child{border-bottom:none}
  #inspector .micro{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  #inspector .stat-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
  #inspector .stat-row .v{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--good)}
  #inspector .chip-row{display:flex;flex-wrap:wrap;gap:6px}
  #inspector .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2)}
  #inspector .chip.connected{color:var(--good);border-color:color-mix(in srgb, var(--good) 40%, transparent)}
  #inspector .wf-list{display:flex;flex-direction:column;gap:8px}
  #inspector .wf-row{font-size:13px;display:flex;align-items:center;gap:8px}
  #inspector .wf-dot{width:7px;height:7px;border-radius:50%;background:var(--warning);flex-shrink:0}
  #inspector .activity-row{padding:10px 0;border-top:1px solid var(--border)}
  #inspector .activity-row:first-child{border-top:none}
  #inspector .activity-row .summary{font-size:13px;line-height:1.4}
  #inspector .activity-row .meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  #inspector .activity-row .ts{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
  #inspector .activity-row .status-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
  #inspector .approve-btn{margin-top:6px}
  #inspector .empty{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(160deg,#1E3A8A,#0EA5E9);display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:17px">⛵</div>
    <h1 style="font-size:20px;font-weight:800;letter-spacing:-0.01em">Sailz</h1>
    <p style="font-size:13px;color:var(--muted);margin:6px 0 22px">Owner sign-in</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" value=""></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div id="loginErr" class="mono" style="color:var(--critical);font-size:12px;margin-bottom:12px"></div>
    <button class="primary" style="width:100%;padding:11px;font-size:13px" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" class="hidden">
  <div id="topbar">
    <div class="brand"><span class="mark">⛵</span><span id="clinicName">Clinic</span><span class="powered">· powered by Sailz</span></div>
    <div class="right">
      <span class="stats" id="statsline"></span>
      <a class="ghost-link" href="/brain.html">Brain map</a>
      <a class="ghost-link" href="/dashboard-classic.html">Classic view</a>
      <button onclick="logout()">Sign out</button>
    </div>
  </div>
  <div id="graph"></div>
  <div id="tooltip"></div>

  <div id="inspector">
    <div class="head">
      <div class="avatar" id="insAvatar"></div>
      <div>
        <h2 id="insName"></h2>
        <div class="status-row"><span class="status-dot" id="insStatusDot"></span><span class="status-label mono" id="insStatusLabel"></span></div>
      </div>
      <button class="close" onclick="closeInspector()">&times;</button>
    </div>
    <div class="section">
      <div class="micro">Today</div>
      <div id="insStats"></div>
    </div>
    <div class="section">
      <div class="micro">Workflows</div>
      <div class="wf-list" id="insWorkflows"></div>
    </div>
    <div class="section">
      <div class="micro">Uses</div>
      <div class="chip-row" id="insTools"></div>
    </div>
    <div class="section">
      <div class="micro">Recent activity</div>
      <div id="insActivity"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("token");

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "content-type": "application/json", Authorization: "Bearer " + token, ...(opts.headers || {}) } });
  if (res.status === 401) { logout(); throw new Error("auth"); }
  return res.json();
}

async function doLogin() {
  $("loginErr").textContent = "";
  const res = await fetch("/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: $("em").value.trim(), password: $("pw").value }) });
  const data = await res.json();
  if (!res.ok) { $("loginErr").textContent = data.error || "Sign-in failed"; return; }
  token = data.token; sessionStorage.setItem("token", token);
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  boot();
}
function logout(){ sessionStorage.removeItem("token"); location.reload(); }
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function fmtRelative(ts) {
  const diffMs = Date.now() - new Date(ts).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  return Math.round(hrs / 24) + "d ago";
}
function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

const STATUS_COLOR = { active: "var(--good)", idle: "var(--muted)", needs_review: "var(--critical)", offline: "var(--muted)" };
const STATUS_TEXT = { active: "ACTIVE", idle: "IDLE", needs_review: "NEEDS REVIEW", offline: "NOT CONNECTED" };
const AGENT_ORDER = ["leads", "receptionist", "calling", "audit", "billing"];
const HUB_RADIUS = 260;

let Graph, tooltip, hoveredNode = null, neighbors = new Set(), selectedAgent = null;
let graphData = { nodes: [], links: [] };

function pinRadialBackbone(nodes) {
  nodes.forEach((n) => {
    if (n.type === "clinic") { n.fx = 0; n.fy = 0; }
    if (n.type === "agent") {
      const idx = AGENT_ORDER.indexOf(n.id);
      if (idx === -1) return;
      const angle = (idx / AGENT_ORDER.length) * 2 * Math.PI - Math.PI / 2;
      n.fx = HUB_RADIUS * Math.cos(angle);
      n.fy = HUB_RADIUS * Math.sin(angle);
    }
  });
}

function initGraph() {
  tooltip = $("tooltip");
  Graph = ForceGraph()($("graph"))
    .backgroundColor("#FAFAF8")
    .nodeId("id")
    .linkSource("source")
    .linkTarget("target")
    .d3AlphaDecay(0.03)
    .d3VelocityDecay(0.4)
    .warmupTicks(100)
    .cooldownTime(3000)
    .linkColor((l) => (l.kind === "handoff" ? "rgba(17,17,17,0.28)" : "rgba(100,116,139,0.20)"))
    .linkWidth((l) => (l.kind === "handoff" ? 1.6 : 0.6))
    .linkDirectionalParticles((l) => (l.kind === "handoff" || l.kind === "spoke" ? 2 : 0))
    .linkDirectionalParticleWidth((l) => (l.kind === "spoke" ? 2 : 2.4))
    .linkDirectionalParticleColor((l) => (l.kind === "spoke" ? "rgba(30,58,138,0.55)" : "rgba(17,17,17,0.5)"))
    .linkDirectionalParticleSpeed(0.006)
    .nodeCanvasObject(paintNode)
    .onNodeHover(onHover)
    .onNodeClick(onClick)
    .onBackgroundClick(() => { closeInspector(); });

  Graph.d3Force("charge").strength((n) => (n.type === "clinic" || n.type === "agent" ? -40 : -90));
  Graph.d3Force("link").distance((l) => (l.kind === "handoff" ? HUB_RADIUS : l.kind === "spoke" ? HUB_RADIUS : 30));
  Graph.onEngineStop(() => Graph.zoomToFit(400, 90));
  [300, 1000, 2500].forEach((ms) => setTimeout(() => Graph.zoomToFit(300, 90), ms));

  window.addEventListener("resize", () => Graph.width(window.innerWidth).height(window.innerHeight));
  window.addEventListener("mousemove", (e) => {
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 10) + "px";
  });
}

function paintNode(node, ctx, globalScale) {
  if (!Number.isFinite(node.x) || !Number.isFinite(node.y)) return;
  const dimmed = hoveredNode && !neighbors.has(node.id) && node.id !== hoveredNode.id;
  const alpha = dimmed ? 0.12 : 1;

  if (node.type === "clinic") {
    const size = 22;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = "rgba(14,165,233,0.45)"; ctx.shadowBlur = 22;
    const grad = ctx.createRadialGradient(node.x, node.y, 1, node.x, node.y, size);
    grad.addColorStop(0, "#1E3A8A"); grad.addColorStop(1, "#0EA5E9");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(node.x, node.y, size, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("⛵", node.x, node.y + 1);
    ctx.restore();
    if (globalScale > 0.35) drawLabel(ctx, node.x, node.y + size + 16, node.name, alpha, 14, true, "#111");
    return;
  }

  if (node.type === "agent") {
    const size = 19;
    const active = node.status === "active";
    const t = window.__brainT || 0;
    const pulse = active ? 1 + 0.1 * Math.sin(t / 18) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = node.color; ctx.shadowBlur = active ? 28 : 16;
    const grad = ctx.createRadialGradient(node.x, node.y, 1, node.x, node.y, size * pulse);
    grad.addColorStop(0, node.color); grad.addColorStop(1, shade(node.color, -18));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(node.x, node.y, size * pulse, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = node.id === selectedAgent ? "#111" : "#fff";
    ctx.lineWidth = node.id === selectedAgent ? 3 : 2.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff"; ctx.font = "15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(node.glyph, node.x, node.y + 1);
    ctx.restore();
    if (globalScale > 0.35) drawLabel(ctx, node.x, node.y + size * pulse + 16, node.name, alpha, 13, true, "#111");
    return;
  }

  if (node.type === "workflow") { drawGlowDot(ctx, node, 4, "#D9A441", alpha); return; }

  if (node.type === "tool") {
    const size = 5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#F4F4F2";
    roundRect(ctx, node.x - size, node.y - size, size * 2, size * 2, 2); ctx.fill();
    ctx.strokeStyle = node.connected ? (node.color || "#8A8A86") : "rgba(138,138,134,0.5)";
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
    if (globalScale > 1.6) drawLabel(ctx, node.x, node.y + 11, node.name, alpha * 0.85, 9, false, "#52514E");
    return;
  }

  if (node.type === "event") { drawGlowDot(ctx, node, 2.4, node.color, alpha * 0.7); return; }

  if (node.type === "patient") {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = "#C9C9C6";
    ctx.beginPath(); ctx.arc(node.x, node.y, 4, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
    if (globalScale > 1.4) drawLabel(ctx, node.x, node.y + 10, node.name, alpha * 0.85, 9, false, "#52514E");
    return;
  }
}

function onHover(node) {
  hoveredNode = node;
  neighbors = new Set();
  if (node) {
    graphData.links.forEach((l) => {
      const s = typeof l.source === "object" ? l.source.id : l.source;
      const t = typeof l.target === "object" ? l.target.id : l.target;
      if (s === node.id) neighbors.add(t);
      if (t === node.id) neighbors.add(s);
    });
    tooltip.textContent = node.name || node.type;
    tooltip.style.opacity = 1;
    document.body.style.cursor = "pointer";
  } else {
    tooltip.style.opacity = 0;
    document.body.style.cursor = "default";
  }
}

function onClick(node) {
  if (node.type === "agent") {
    selectedAgent = node.id;
    Graph.centerAt(node.x, node.y, 600);
    Graph.zoom(2.1, 600);
    openInspector(node.id);
  } else if (node.type === "clinic") {
    closeInspector();
    Graph.zoomToFit(500, 90);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawGlowDot(ctx, node, r, color, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.shadowColor = color; ctx.shadowBlur = 7;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(node.x, node.y, r, 0, 2 * Math.PI); ctx.fill(); ctx.restore();
}
function drawLabel(ctx, x, y, text, alpha, size, bold, color) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color || "#52514E";
  ctx.font = `${bold ? 700 : 400} ${size}px Archivo, sans-serif`;
  ctx.textAlign = "center"; ctx.fillText(text, x, y); ctx.restore();
}
function shade(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00ff) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000ff) + amt));
  return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

async function refreshGraph() {
  const d = await api("/api/brain/graph");
  $("statsline").textContent = `Agents: ${d.stats.agents} · Actions this week: ${d.stats.actionsThisWeek} · Connections: ${d.stats.connections}`;
  pinRadialBackbone(d.nodes);
  // spoke edges are agent -> clinic, so directional particles read as
  // "the agents feed the center" rather than the center broadcasting out
  d.links.forEach((l) => { if (l.kind === "spoke") { const t = l.target; l.target = l.source; l.source = t; } });
  graphData = d;
  Graph.graphData(d);
  if (selectedAgent && $("inspector").classList.contains("open")) refreshInspector(selectedAgent);
}

async function openInspector(agentId) {
  $("inspector").classList.add("open");
  await refreshInspector(agentId);
}
function closeInspector() {
  selectedAgent = null;
  $("inspector").classList.remove("open");
}

async function refreshInspector(agentId) {
  const a = await api("/api/brain/agents/" + agentId);
  $("insAvatar").style.background = a.color;
  $("insAvatar").textContent = a.glyph;
  $("insName").textContent = a.name;
  $("insStatusDot").style.background = STATUS_COLOR[a.status] || "var(--muted)";
  $("insStatusLabel").textContent = STATUS_TEXT[a.status] || a.status;
  $("insStatusLabel").style.color = STATUS_COLOR[a.status] || "var(--muted)";

  $("insStats").innerHTML = a.todayStats.map((s) => `<div class="stat-row"><span>${esc(s.label)}</span><span class="v">${esc(String(s.value))}</span></div>`).join("");

  $("insWorkflows").innerHTML = a.workflows.map((w) => `<div class="wf-row"><span class="wf-dot"></span>${esc(w)}</div>`).join("");

  $("insTools").innerHTML = a.tools.map((t) => `<span class="chip ${t.connected ? "connected" : ""}">${t.connected ? "✓ " : ""}${esc(t.name)}</span>`).join("") || `<span class="empty">No tools configured</span>`;

  $("insActivity").innerHTML = a.recentActivity.map((ev) => `
    <div class="activity-row">
      <div class="summary">${esc(ev.summary)}</div>
      <div class="meta"><span class="ts">${fmtRelative(ev.ts)}</span><span class="status-pill">${esc(ev.status || "")}</span></div>
      ${ev.status === "awaiting_approval" && ev.id ? `<button class="primary approve-btn" onclick="approveFromInspector('${ev.id}')">Approve &amp; submit</button>` : ""}
    </div>`).join("") || `<div class="empty">Nothing yet.</div>`;
}

async function approveFromInspector(claimId) {
  if (!claimId) return;
  await api(`/api/claims/${claimId}/approve`, { method: "POST" });
  refreshGraph();
}

async function boot() {
  const me = await api("/api/dashboard");
  $("clinicName").textContent = me.settings.clinicName;
  initGraph();
  Graph.width(window.innerWidth).height(window.innerHeight);
  await refreshGraph();
  setInterval(refreshGraph, 10000);
  (function tick(){ window.__brainT = (window.__brainT || 0) + 1; requestAnimationFrame(tick); })();
}

if (token) {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  boot().catch(() => {});
}
</script>
</body>
</html>
