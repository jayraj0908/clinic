<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailz — HQ console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f0ead8;--dim:#77777c;--line:rgba(240,234,216,.09);--glass:rgba(13,13,15,.88);--accent:#c9a066}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#050506;font-family:'Inter',sans-serif;color:var(--ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 20px 80px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
  .brand .t{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase}
  .brand .s{font:500 9px 'Inter';letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  a.back{color:var(--dim);font:500 10px 'Inter';letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer}
  a.back:hover{color:var(--ink)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;margin:0 0 4px}
  .sub{font:500 11px 'Inter';color:var(--dim);margin:0 0 24px}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:20px}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--glass);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .2s}
  .row:hover{border-color:rgba(240,234,216,.25)}
  .row .name{font:600 13px 'Inter';flex:1}
  .row .meta{font:500 10px 'Inter';color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .status-chip{font:700 8.5px 'Inter';letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .status-sent{background:rgba(120,120,130,.18);color:#a9a9ae}
  .status-in_progress{background:rgba(160,130,60,.18);color:#d4af6a}
  .status-completed{background:rgba(120,180,160,.18);color:#7fd6b0}
  .status-activated{background:rgba(90,140,220,.18);color:#8fb4e8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:20px}
  .panel h2{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0 0 14px}
  label{display:block;font:600 9px 'Inter';letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:14px 0 6px}
  label:first-of-type{margin-top:0}
  input[type=text],input[type=number],textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;
    color:var(--ink);font:400 13px 'Inter';padding:10px 12px;outline:none}
  textarea{resize:vertical;min-height:70px;line-height:1.5;font-family:'JetBrains Mono',monospace;font-size:12px}
  textarea.tall{min-height:130px}
  .template-note{font:400 11px 'Inter';color:var(--dim);line-height:1.6;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px}
  .fact-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .fact-row textarea{flex:1;min-height:48px}
  .fact-row .rm{color:var(--dim);cursor:pointer;padding:8px;flex:none}
  .agent-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .agent-row:last-child{border-bottom:0}
  .agent-row input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--ink)}
  .agent-row .an{font:600 12px 'Inter';color:var(--ink)}
  .agent-row .at{font:400 11px 'Inter';color:var(--dim);margin-top:2px}
  button{appearance:none;border:0;cursor:pointer;font:600 10.5px 'Inter';letter-spacing:.12em;text-transform:uppercase;
    border-radius:9px;padding:12px 18px;transition:opacity .2s,background .2s}
  button:disabled{opacity:.4;cursor:default}
  .btn-primary{background:var(--ink);color:#111}
  .btn-primary:hover:not(:disabled){opacity:.88}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-danger{background:rgba(224,138,122,.14);color:#e08a7a;border:1px solid rgba(224,138,122,.3)}
  .actionbar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .msg{font:500 12px 'Inter';margin-top:14px;padding:10px 14px;border-radius:8px}
  .msg.ok{background:rgba(127,214,176,.1);color:#7fd6b0;border:1px solid rgba(127,214,176,.3)}
  .msg.err{background:rgba(224,138,122,.1);color:#e08a7a;border:1px solid rgba(224,138,122,.3)}
  .login{max-width:340px;margin:120px auto}
  .spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(240,234,216,.2);border-top-color:var(--ink);
    animation:spin .8s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;color:var(--dim);font:500 12px 'Inter';padding:40px 0}

  /* ---------- HQ console tab bar ---------- */
  .tabbar{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .tabbar button{background:transparent;border:0;border-radius:0;color:var(--dim);font:600 10px 'Inter';
    letter-spacing:.16em;text-transform:uppercase;padding:10px 4px;margin-right:22px;cursor:pointer;
    border-bottom:2px solid transparent}
  .tabbar button.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tabbar button:hover:not(.active){color:var(--ink)}

  /* ---------- CLIENTS tab ---------- */
  .mrr-total{display:flex;align-items:baseline;gap:10px;margin-bottom:22px}
  .mrr-total .n{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--ink);line-height:1}
  .mrr-total .l{font:500 9px 'Inter';letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .client-card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:18px}
  .client-card .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.healthy{background:#7fd6b0;box-shadow:0 0 6px rgba(127,214,176,.6)}
  .dot.stale{background:#d4af6a}
  .dot.error{background:#e08a7a;box-shadow:0 0 6px rgba(224,138,122,.6)}
  .client-card .cn{font:600 14px 'Inter';flex:1}
  .client-card .rm{color:var(--dim);cursor:pointer;font-size:13px;padding:2px 4px}
  .client-card .rm:hover{color:#e08a7a}
  .client-stats{display:flex;gap:14px;margin-bottom:10px}
  .client-stats .s{flex:1}
  .client-stats .s .n{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink);line-height:1}
  .client-stats .s .l{font:500 8px 'Inter';letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:3px}
  .agent-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .agent-pill{font:500 9px 'Inter';padding:3px 9px;border-radius:999px;background:rgba(127,214,176,.1);color:#7fd6b0;border:1px solid rgba(127,214,176,.25)}
  .client-meta{font:400 11px 'Inter';color:var(--dim);margin-bottom:10px}
  .client-meta a{color:var(--dim)}
  .client-mrr{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .client-mrr label{margin:0;flex:none;font-size:9px}
  .client-mrr input{width:90px;padding:6px 8px;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="brand"><div><span class="t">Sailz</span> <span class="s">— HQ console</span></div><a class="back" id="logoutBtn">Sign out</a></div>
  <div id="content"><div class="empty"><span class="spinner"></span>Loading…</div></div>
</div>

<script>
const $=(id)=>document.getElementById(id);
let token=sessionStorage.getItem("token");
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
async function api(path,opts={}){
  const res=await fetch(path,{...opts,headers:{"content-type":"application/json",Authorization:"Bearer "+token,...(opts.headers||{})}});
  if(res.status===401){sessionStorage.removeItem("token");renderLogin();throw new Error("auth")}
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||"Request failed");
  return data;
}
$("logoutBtn").onclick=()=>{sessionStorage.removeItem("token");renderLogin()};

function fmtRelative(iso){
  if(!iso)return "never";
  const ms=Date.now()-new Date(iso).getTime();
  if(ms<0)return "just now";
  const m=Math.floor(ms/60000);
  if(m<1)return "just now";
  if(m<60)return m+"m ago";
  const h=Math.floor(m/60);
  if(h<24)return h+"h ago";
  return Math.floor(h/24)+"d ago";
}

function renderLogin(){
  $("content").innerHTML=`
    <div class="login card">
      <label>Email</label><input type="text" id="lg_email">
      <label>Password</label><input type="text" id="lg_pass" style="-webkit-text-security:disc">
      <div class="actionbar"><button class="btn-primary" id="lg_btn" style="flex:1">Sign in</button></div>
      <div id="lg_err" class="msg err" style="display:none"></div>
    </div>`;
  $("lg_btn").onclick=async()=>{
    const res=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:$("lg_email").value.trim(),password:$("lg_pass").value})});
    const data=await res.json();
    if(!res.ok){$("lg_err").style.display="block";$("lg_err").textContent=data.error||"Sign-in failed";return}
    token=data.token; sessionStorage.setItem("token",token);
    renderShell();
  };
}

/* ============================ shell / tabs ============================ */
let activeTab="clients";
function renderShell(){
  const qsTab=new URLSearchParams(location.search).get("tab");
  if(qsTab==="onboarding"||qsTab==="clients")activeTab=qsTab;
  $("content").innerHTML=`
    <div class="tabbar">
      <button data-tab="clients" class="${activeTab==='clients'?'active':''}">Clients</button>
      <button data-tab="onboarding" class="${activeTab==='onboarding'?'active':''}">Onboarding</button>
    </div>
    <div id="tabBody"><div class="empty"><span class="spinner"></span>Loading…</div></div>
  `;
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.onclick=()=>{ activeTab=b.dataset.tab; history.replaceState(null,'','?tab='+activeTab); renderShell(); };
  });
  if(activeTab==="clients") renderClients(); else renderOnboardingList();
}

/* ============================ CLIENTS tab ============================== */
let clientsData=null;
async function renderClients(){
  try{ clientsData=await api("/api/hq/clients"); }catch(e){ $("tabBody").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }
  const totalMrr=clientsData.clients.reduce((sum,c)=>sum+(c.mrr||0),0);
  $("tabBody").innerHTML=`
    <div class="mrr-total"><div class="n">$${totalMrr.toLocaleString()}</div><div class="l">Total MRR / mo</div></div>
    <div class="panel" style="margin-bottom:20px">
      <h2>Add a client</h2>
      <label>Name</label><input type="text" id="ac_name" placeholder="The Burg">
      <label>Base URL</label><input type="text" id="ac_url" placeholder="https://theburg.sailz.io">
      <label>Heartbeat key</label><input type="text" id="ac_key" placeholder="must match that deployment's HEARTBEAT_KEY">
      <div class="actionbar"><button class="btn-primary" id="ac_btn">Add + poll now</button></div>
      <div id="ac_result"></div>
    </div>
    ${clientsData.clients.length?`<div class="client-grid" id="clientGrid"></div>`:`<div class="empty">No clients on the board yet — add one above.</div>`}
  `;
  $("ac_btn").onclick=addClient;
  if(clientsData.clients.length) paintClientGrid();
}

async function addClient(){
  const name=$("ac_name").value.trim(), baseUrl=$("ac_url").value.trim(), key=$("ac_key").value.trim();
  if(!name||!baseUrl||!key)return;
  $("ac_btn").disabled=true;
  try{
    await api("/api/hq/clients",{method:"POST",body:JSON.stringify({name,baseUrl,key})});
    await renderClients();
  }catch(e){
    $("ac_result").innerHTML=`<div class="msg err">${esc(e.message)}</div>`;
    $("ac_btn").disabled=false;
  }
}

function statusDot(s){return `<span class="dot ${s}"></span>`}

function paintClientGrid(){
  $("clientGrid").innerHTML=clientsData.clients.map(c=>{
    const d=c.latest&&c.latest.ok?c.latest.data:null;
    const counts=d?d.counts:null;
    const agents=d?d.activeAgents:[];
    return `
    <div class="client-card" data-client="${esc(c.id)}">
      <div class="ch">${statusDot(c.status)}<div class="cn">${esc(c.name)}</div><span class="rm" data-remove="${esc(c.id)}">✕</span></div>
      <div class="client-stats">
        <div class="s"><div class="n">${counts?counts.callsThisWeek:'—'}</div><div class="l">Calls</div></div>
        <div class="s"><div class="n">${counts?counts.ordersThisWeek:'—'}</div><div class="l">Orders</div></div>
        <div class="s"><div class="n">${counts?counts.leadsThisWeek:'—'}</div><div class="l">Leads</div></div>
      </div>
      <div class="agent-pills">${agents.length?agents.map(a=>`<span class="agent-pill">${esc(a)}</span>`).join(''):'<span class="template-note" style="padding:4px 8px;margin:0">No active agents</span>'}</div>
      <div class="client-meta">Last heartbeat: ${fmtRelative(c.latest&&c.latest.ts)}${c.status==='error'&&c.latest?' — '+esc(c.latest.error||''):''} · <a href="${esc(c.baseUrl)}" target="_blank" rel="noopener">${esc(c.baseUrl.replace(/^https?:\/\//,''))}</a></div>
      <div class="client-mrr">
        <label>MRR $</label><input type="number" min="0" step="1" value="${c.mrr||0}" data-mrr="${esc(c.id)}">
        <button class="btn-ghost" data-poll="${esc(c.id)}" style="padding:6px 10px;font-size:9px">Poll now</button>
      </div>
    </div>`;
  }).join("");
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.onclick=async()=>{
      if(!confirm("Remove this client from the board? Heartbeat history is discarded — this doesn't touch their live deployment."))return;
      await api(`/api/hq/clients/${el.dataset.remove}`,{method:"DELETE"});
      renderClients();
    };
  });
  document.querySelectorAll('[data-poll]').forEach(el=>{
    el.onclick=async()=>{ el.disabled=true; await api(`/api/hq/clients/${el.dataset.poll}/poll`,{method:"POST"}); renderClients(); };
  });
  document.querySelectorAll('[data-mrr]').forEach(el=>{
    el.onchange=async()=>{ await api(`/api/hq/clients/${el.dataset.mrr}`,{method:"PATCH",body:JSON.stringify({mrr:Number(el.value)||0})}); renderClients(); };
  });
}

/* ============================ ONBOARDING tab ============================ */
/* Identical behavior to the pre-Stage-4 standalone onboarding-review.html
   (redirected here now) — just rendered into #tabBody instead of owning
   the whole page. */
function statusChip(s){return `<span class="status-chip status-${s}">${s.replace("_"," ")}</span>`}

function newLinkPanel(resultHtml){
  return `
    <div class="panel" style="margin-bottom:20px">
      <h2>New onboarding link</h2>
      <label>Client / business name</label>
      <input type="text" id="nl_name" placeholder="The Burg">
      <div class="actionbar"><button class="btn-primary" id="nl_btn">Create link</button></div>
      <div id="nl_result">${resultHtml||""}</div>
    </div>`;
}
function wireNewLinkPanel(){
  $("nl_btn").onclick=async()=>{
    const name=$("nl_name").value.trim();
    if(!name) return;
    $("nl_btn").disabled=true;
    try{
      const entry=await api("/api/onboarding/create",{method:"POST",body:JSON.stringify({clientName:name})});
      $("nl_result").innerHTML=`<div class="msg ok">Link created — send this to the client:</div>
        <input type="text" readonly value="${esc(entry.url)}" onclick="this.select()" style="margin-top:8px">
        <div class="actionbar"><button class="btn-ghost" id="nl_copy">Copy link</button></div>`;
      $("nl_copy").onclick=()=>{ navigator.clipboard.writeText(entry.url); $("nl_copy").textContent="Copied"; setTimeout(()=>{$("nl_copy").textContent="Copy link"},1500); };
      $("nl_name").value="";
      onboardData=await api("/api/onboarding/admin");
      renderOnboardRows();
    }catch(e){
      $("nl_result").innerHTML=`<div class="msg err">${esc(e.message)}</div>`;
    }finally{
      $("nl_btn").disabled=false;
    }
  };
}
let onboardData=null;
function renderOnboardRows(){
  if(!onboardData.onboardings.length){ $("rowsWrap").innerHTML=`<div class="empty">No onboarding links yet — create one above.</div>`; return; }
  $("rowsWrap").innerHTML=`<div class="list">${onboardData.onboardings.map(o=>`
    <div class="row" onclick="location.search='?tab=onboarding&id=${o.id}'">
      <div class="name">${esc(o.clientName)}</div>
      <div class="meta">${esc(o.currentStep)}</div>
      ${statusChip(o.status)}
    </div>`).join("")}</div>`;
}
async function renderOnboardingList(){
  const id=new URLSearchParams(location.search).get("id");
  if(id) return renderOnboardDetail(id);
  $("tabBody").innerHTML=`<div class="empty"><span class="spinner"></span>Loading…</div>`;
  try{ onboardData=await api("/api/onboarding/admin"); }catch(e){ return; }
  $("tabBody").innerHTML=newLinkPanel()+`<div id="rowsWrap"></div>`;
  wireNewLinkPanel();
  renderOnboardRows();
}

let draftState=null, currentId=null, factRows=[];
async function renderOnboardDetail(id){
  currentId=id;
  $("tabBody").innerHTML=`<div class="empty"><span class="spinner"></span>Loading…</div>`;
  let o;
  try{ o=await api(`/api/onboarding/admin/${id}`); }catch(e){ $("tabBody").innerHTML=`<div class="empty">${esc(e.message)}</div>`; return; }

  if(!o.draft){
    $("tabBody").innerHTML=`<a class="back" onclick="location.search='?tab=onboarding'">‹ All onboardings</a><div class="empty" style="margin-top:20px">${esc(o.clientName)} hasn't finished the wizard yet (currently on "${esc(o.currentStep)}").</div>`;
    return;
  }
  draftState=JSON.parse(JSON.stringify(o.draft));
  factRows=draftState.memoryFacts.map(f=>({...f}));

  $("tabBody").innerHTML=`
    <a class="back" onclick="location.search='?tab=onboarding'">‹ All onboardings</a>
    <h1 style="margin-top:16px">${esc(o.clientName)} ${statusChip(o.status)}</h1>
    <p class="sub">Draft slug: <strong>${esc(draftState.instanceJson.id)}</strong> — created ${new Date(o.createdAt).toLocaleDateString()}</p>

    <div class="grid2">
      <div class="panel">
        <h2>Template defaults</h2>
        <div class="template-note">instances/_template/ — every new instance starts here. This is what the wizard's answers are overriding.</div>
        <label>instance.json</label>
        <textarea class="tall" readonly>${esc(JSON.stringify(o.template.instanceJson,null,2))}</textarea>
        <label>clinic-profile.json</label>
        <textarea class="tall" readonly>${esc(JSON.stringify(o.template.clinicProfileJson,null,2))}</textarea>
      </div>

      <div class="panel">
        <h2>This client's draft</h2>
        <label>Business name</label><input type="text" id="d_name" value="${esc(draftState.instanceJson.name)}">
        <label>Vertical</label><input type="text" id="d_vertical" value="${esc(draftState.instanceJson.vertical)}">
        <label>Timezone</label><input type="text" id="d_tz" value="${esc(draftState.instanceJson.timezone)}">
        <label>Instance slug (folder name)</label><input type="text" id="d_slug" value="${esc(draftState.instanceJson.id)}">
        <label>clinic-profile.json</label>
        <textarea class="tall" id="d_profile">${esc(JSON.stringify(draftState.clinicProfileJson,null,2))}</textarea>
        <label>messages.json</label>
        <textarea class="tall" id="d_messages">${esc(JSON.stringify(draftState.messagesJson,null,2))}</textarea>
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Agents to activate</h2>
      <div class="template-note">Pre-checked from ${esc(draftState.instanceJson.vertical)}'s recommended set — adjust before activating. Everything unchecked still shows up in the client's catalog as dormant, one click away.</div>
      <div id="agentPicker">${agentPickerHTML(o.engineCatalog||[],draftState.instanceJson.agents||[])}</div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Proposed memory facts (${factRows.length})</h2>
      <div id="factList"></div>
      <div class="actionbar"><button class="btn-ghost" onclick="addFact()">+ Add fact</button></div>
    </div>

    <div class="actionbar">
      <button class="btn-ghost" id="saveBtn">Save changes</button>
      ${o.status==="activated"
        ? `<button class="btn-primary" disabled>Already activated as ${esc(draftState.instanceJson.id)}</button>`
        : `<button class="btn-primary" id="activateBtn">Activate → write instances/${esc(draftState.instanceJson.id)}/</button>`}
    </div>
    <div id="reviewMsg"></div>
  `;
  paintFacts();
  $("saveBtn").onclick=saveDraft;
  if(o.status!=="activated") $("activateBtn").onclick=activate;
}

function agentPickerHTML(engineCatalog,checkedIds){
  const checked=new Set(checkedIds);
  if(!engineCatalog.length)return `<div class="template-note">No engine agents found.</div>`;
  return engineCatalog.map(a=>`
    <label class="agent-row">
      <input type="checkbox" data-agent-id="${esc(a.id)}" ${checked.has(a.id)?"checked":""}>
      <div><div class="an">${esc(a.name)}</div><div class="at">${esc(a.tagline||"")}${a.requires&&a.requires.length?" · needs "+esc(a.requires.join(", ")):""}</div></div>
    </label>`).join("");
}
function checkedAgentIds(){
  return Array.from(document.querySelectorAll('[data-agent-id]:checked')).map(el=>el.dataset.agentId);
}

function paintFacts(){
  $("factList").innerHTML=factRows.map((f,i)=>`
    <div class="fact-row">
      <textarea data-fact="${i}">${esc(f.fact)}</textarea>
      <span class="rm" onclick="removeFact(${i})">✕</span>
    </div>`).join("") || `<div class="template-note">No proposed facts.</div>`;
}
function addFact(){ factRows.push({type:"policy_correction",fact:"",source:"owner review"}); paintFacts(); }
function removeFact(i){ syncFacts(); factRows.splice(i,1); paintFacts(); }
function syncFacts(){
  factRows.forEach((f,i)=>{ const el=document.querySelector(`[data-fact="${i}"]`); if(el) f.fact=el.value; });
}

function showMsg(text,ok){
  $("reviewMsg").innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`;
}

async function saveDraft(){
  syncFacts();
  let profileJson, messagesJson;
  try{
    profileJson=JSON.parse($("d_profile").value);
    messagesJson=JSON.parse($("d_messages").value);
  }catch(e){ showMsg("clinic-profile.json / messages.json must be valid JSON: "+e.message,false); return; }
  const patch={
    instanceJson:{ id:$("d_slug").value.trim(), name:$("d_name").value.trim(), vertical:$("d_vertical").value.trim(), timezone:$("d_tz").value.trim(), agents:checkedAgentIds() },
    clinicProfileJson:profileJson,
    messagesJson,
    memoryFacts:factRows.filter(f=>f.fact.trim()),
  };
  try{
    await api(`/api/onboarding/admin/${currentId}/draft`,{method:"POST",body:JSON.stringify(patch)});
    await renderOnboardDetail(currentId);
    showMsg("Saved.",true);
  }catch(e){ showMsg(e.message,false); }
}

async function activate(){
  await saveDraft();
  if(!confirm(`Write instances/${draftState.instanceJson.id}/ to disk and seed approved memory facts? This is the live activation step.`)) return;
  const btn=$("activateBtn"); if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Activating…'; }
  try{
    const result=await api(`/api/onboarding/admin/${currentId}/activate`,{method:"POST"});
    await renderOnboardDetail(currentId);
    showMsg(`Activated — instances/${result.slug}/ written to disk.${result.promptPreview?" Prompt preview composed for review.":""}`,true);
  }catch(e){ showMsg(e.message,false); if(btn){btn.disabled=false;btn.textContent="Activate";} }
}

if(token) renderShell(); else renderLogin();
</script>
</body>
</html>
