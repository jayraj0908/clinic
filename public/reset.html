<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailz — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f0ead8;--dim:#77777c;--line:rgba(240,234,216,.09);--glass:rgba(13,13,15,.88)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#050506;font-family:'Inter',sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;padding:36px;background:var(--glass);border:1px solid var(--line);border-radius:16px;margin:20px}
  .boat{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8e8,#d9c78f 60%,#8f7658);margin-bottom:18px}
  h1{font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.12em;color:var(--ink);text-transform:uppercase;margin:0 0 4px}
  p.sub{font:500 10px 'Inter';letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:26px}
  .field{margin-bottom:18px}
  label{display:block;font:600 9px 'Inter';letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
  input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);color:var(--ink);font:400 13px 'Inter'}
  .err{color:#e08a7a;font:500 11px 'Inter';margin-bottom:10px;min-height:14px}
  .ok{color:#7fd6b0;font:500 12px 'Inter';line-height:1.6}
  button{width:100%;padding:12px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#050506;font:700 11px 'Inter';letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  a{color:var(--dim);font:500 11px 'Inter'}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="boat"></div>
  <h1>Sailz</h1>
  <p class="sub">Set a new password</p>
  <div class="field"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password"></div>
  <div class="field"><label for="p2">Confirm new password</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div class="err" id="err"></div>
  <button id="btn" onclick="submit()">Set password</button>
</div>
<script>
const token=location.pathname.split('/').pop();
async function submit(){
  const err=document.getElementById('err');
  const p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
  err.textContent="";
  if(p1.length<8){err.textContent="Password must be at least 8 characters";return}
  if(p1!==p2){err.textContent="Passwords don't match";return}
  const res=await fetch('/api/auth/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,newPassword:p1})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){err.textContent=data.error||"Something went wrong.";return}
  document.getElementById('card').innerHTML='<div class="boat"></div><h1>Sailz</h1><p class="ok">Password updated. You can close this tab and sign in with your new password.</p>';
}
</script>
</body>
</html>
