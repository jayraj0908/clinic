<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sailz — Set up your brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f0ead8;--dim:#77777c;--line:rgba(240,234,216,.09);--glass:rgba(13,13,15,.88);--accent:#c9a066}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#050506;font-family:'Inter',sans-serif;color:var(--ink)}
  body{background-image:radial-gradient(ellipse at 50% -10%, rgba(201,160,102,.10), transparent 55%)}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 80px;min-height:100vh;display:flex;flex-direction:column}
  .brand{text-align:center;margin:8px 0 28px}
  .brand .t{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
  .brand .s{font:500 9px 'Inter';letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin-top:6px}
  .progress{display:flex;gap:5px;margin-bottom:30px}
  .progress i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s}
  .progress i.done{background:var(--accent)}
  .progress i.now{background:rgba(240,234,216,.5)}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:26px 22px;flex:1}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;letter-spacing:.04em;margin:0 0 8px;color:var(--ink)}
  .sub{font:500 12px 'Inter';color:var(--dim);line-height:1.6;margin:0 0 24px}
  label{display:block;font:600 9px 'Inter';letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin:18px 0 7px}
  label:first-of-type{margin-top:0}
  input[type=text],input[type=tel],input[type=email],textarea,select{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font:400 14px 'Inter';padding:12px 14px;outline:none;transition:border-color .2s}
  input:focus,textarea:focus,select:focus{border-color:rgba(201,160,102,.5)}
  textarea{resize:vertical;min-height:90px;line-height:1.5}
  textarea.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;min-height:180px}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2377777c' viewBox='0 0 20 20'><path d='M5 8l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font:400 11px 'Inter';color:var(--dim);margin-top:6px;line-height:1.5}
  .btnbar{display:flex;gap:10px;margin-top:28px}
  button{appearance:none;border:0;cursor:pointer;font:600 11px 'Inter';letter-spacing:.14em;text-transform:uppercase;
    border-radius:10px;padding:14px 20px;transition:opacity .2s,background .2s}
  button:disabled{opacity:.4;cursor:default}
  .btn-primary{background:var(--ink);color:#111;flex:1}
  .btn-primary:hover:not(:disabled){opacity:.88}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-link{background:none;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:8px 0;text-transform:none;letter-spacing:0;font:500 12px 'Inter'}
  /* hours grid */
  .hrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:0}
  .hrow .hd{width:70px;font:600 11px 'Inter';letter-spacing:.06em;flex:none}
  .hrow input{flex:1;padding:9px 10px;font-size:13px}
  /* service rows */
  .svc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
  .svc .rm{position:absolute;top:10px;right:12px;color:var(--dim);cursor:pointer;font-size:13px}
  .add-row{display:flex;align-items:center;gap:8px;color:var(--accent);cursor:pointer;font:600 11px 'Inter';letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
  .add-row:before{content:'+';font-size:15px}
  /* file upload */
  .filepick{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;margin-top:10px;transition:border-color .2s}
  .filepick:hover{border-color:rgba(201,160,102,.5)}
  .filepick input{display:none}
  .filepick .fp-t{font:600 11px 'Inter';letter-spacing:.08em;color:var(--ink)}
  .filepick .fp-s{font:400 10px 'Inter';color:var(--dim);margin-top:4px}
  .filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .filechip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 12px;font:500 11px 'Inter'}
  .filechip .fc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filechip .fc-note{display:block;font:400 10px 'Inter';color:var(--dim);white-space:normal;margin-top:2px}
  .filechip .x{color:var(--dim);cursor:pointer;flex:none;font-size:13px;padding:2px 4px}
  .fstatus{flex:none;font:600 9px 'Inter';letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .fstatus.parsed{background:rgba(120,200,120,.14);color:#8fd18f}
  .fstatus.queued{background:rgba(201,160,102,.16);color:var(--accent)}
  .fstatus.failed{background:rgba(224,138,122,.16);color:#e08a7a}
  /* voice recorder — shared between brainDump + interview steps */
  .recorder{border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;margin-top:14px}
  .rec-btn{width:64px;height:64px;border-radius:50%;background:rgba(201,160,102,.12);border:1px solid rgba(201,160,102,.4);
    color:var(--accent);font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;cursor:pointer;
    user-select:none;-webkit-user-select:none;transition:background .15s,transform .1s,border-color .15s}
  .rec-btn.active{background:#c0392b;border-color:#c0392b;color:#fff;transform:scale(1.08)}
  .rec-hint{font:500 10px 'Inter';letter-spacing:.06em;color:var(--dim);margin-top:10px;text-transform:uppercase}
  .rec-playback{margin-top:14px}
  .rec-playback audio{width:100%}
  .rec-actions{display:flex;gap:8px;margin-top:10px}
  .rec-actions button{flex:1}
  .rec-toggle{font:500 11px 'Inter';color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:center;margin-top:14px}
  .fstatus.pending{background:rgba(255,255,255,.08);color:var(--dim)}
  /* goal chips (multi-select) */
  .gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .gchip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
    font:500 12px 'Inter';color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s;user-select:none}
  .gchip.selected{background:rgba(201,160,102,.16);border-color:rgba(201,160,102,.55);color:var(--accent)}
  .gchip-other-input{margin-top:10px}
  /* extraction review */
  .extract-sec{margin-top:18px}
  .extract-sec .k{font:600 9px 'Inter';letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:16px 0 8px}
  .extract-sec .k:first-child{margin-top:0}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:rgba(201,160,102,.1);border:1px solid rgba(201,160,102,.3);border-radius:999px;padding:6px 12px;font:500 11px 'Inter';color:var(--ink)}
  .fact-item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:400 12.5px 'Inter';line-height:1.5;margin-bottom:6px}
  .fact-item .src{display:block;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
  /* interview chat */
  .chat{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .bubble{max-width:88%;padding:12px 15px;border-radius:14px;font:400 13.5px 'Inter';line-height:1.5}
  .bubble.q{background:rgba(255,255,255,.05);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .bubble.a{background:rgba(201,160,102,.14);align-self:flex-end;border-bottom-right-radius:4px;color:var(--ink)}
  .qcount{font:500 10px 'Inter';color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:10px}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(240,234,216,.2);border-top-color:var(--ink);
    animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center-state{text-align:center;padding:50px 10px}
  .center-state .glyph{font-size:38px;margin-bottom:18px;opacity:.85}
  .err{color:#e08a7a;font:500 12px 'Inter';margin-top:10px}
  .done-list{text-align:left;margin-top:24px;border-top:1px solid var(--line);padding-top:20px}
  .done-list li{font:400 12.5px 'Inter';color:var(--dim);line-height:1.7;margin-bottom:6px}
  @media (max-width:400px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="t">Sailz</div><div class="s" id="brandSub">Set up your brain</div></div>
  <div class="progress" id="progress"></div>
  <div class="card" id="card"><div class="center-state"><span class="spinner"></span>Loading…</div></div>
</div>

<script>
const $=(id)=>document.getElementById(id);
const token=location.pathname.split('/').pop();
const STEPS=["basics","goals","hours","services","policies","brainDump","voice","interview","done"];
let state=null; // {clientName,status,currentStep,data}
let stepIdx=0;

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}

async function api(path,opts={}){
  const res=await fetch(path,opts);
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error(data.error||"Something went wrong");e.status=res.status;throw e}
  return data;
}

/* ---------------- shared voice recorder (brainDump + interview steps) ----
   Hold the mic to talk, release to stop; playback + re-record; "Use this
   recording" uploads the blob into the SAME brain-dump pipeline as any
   other file, so a voice memo gets exactly the same parsed/queued/failed
   treatment as an uploaded audio file. */
function recorderHTML(){
  return `
    <div class="recorder" id="recorder">
      <div class="rec-btn" id="recBtn">🎙</div>
      <div class="rec-hint" id="recHint">Hold to talk</div>
      <div class="rec-playback" id="recPlaybackWrap" style="display:none">
        <audio id="recAudio" controls></audio>
        <div class="rec-actions">
          <button class="btn-ghost" id="recRedo">Re-record</button>
          <button class="btn-primary" id="recUse">Use this recording</button>
        </div>
      </div>
    </div>
  `;
}
let _recMedia=null,_recChunks=[],_recBlob=null,_recStream=null;
function wireRecorder(onUploaded){
  const btn=$("recBtn");
  if(!btn) return;
  if(!(navigator.mediaDevices && window.MediaRecorder)){
    $("recHint").textContent="Voice recording isn't supported in this browser.";
    btn.style.opacity=.35; btn.style.pointerEvents="none";
    return;
  }
  const start=async(e)=>{
    e.preventDefault();
    if(_recMedia&&_recMedia.state==="recording") return;
    $("recPlaybackWrap").style.display="none";
    try{
      _recStream=await navigator.mediaDevices.getUserMedia({audio:true});
    }catch{
      $("recHint").textContent="Microphone access denied — check your browser's site settings.";
      return;
    }
    _recChunks=[];
    const mime=(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/webm;codecs=opus"))?"audio/webm;codecs=opus":"audio/webm";
    _recMedia=new MediaRecorder(_recStream,{mimeType:mime});
    _recMedia.ondataavailable=(ev)=>{ if(ev.data.size>0) _recChunks.push(ev.data); };
    _recMedia.onstop=()=>{
      _recBlob=new Blob(_recChunks,{type:"audio/webm"});
      _recStream.getTracks().forEach(t=>t.stop());
      $("recAudio").src=URL.createObjectURL(_recBlob);
      $("recPlaybackWrap").style.display="block";
      btn.classList.remove("active");
      $("recHint").textContent="Tap and hold to talk again";
    };
    _recMedia.start();
    btn.classList.add("active");
    $("recHint").textContent="Recording… release to stop";
  };
  const stop=(e)=>{
    if(e) e.preventDefault();
    if(_recMedia&&_recMedia.state==="recording") _recMedia.stop();
  };
  btn.onmousedown=start; btn.onmouseup=stop; btn.onmouseleave=stop;
  btn.ontouchstart=start; btn.ontouchend=stop;
  $("recRedo").onclick=()=>{
    _recBlob=null; $("recPlaybackWrap").style.display="none"; $("recHint").textContent="Hold to talk";
  };
  $("recUse").onclick=async()=>{
    if(!_recBlob) return;
    const useBtn=$("recUse"); useBtn.disabled=true; useBtn.innerHTML=`<span class="spinner"></span>Uploading…`;
    const filename=`recording-${Date.now()}.webm`;
    try{
      const fd=new FormData();
      // $("f_dump") only exists on the brainDump step — preserve whatever's
      // already typed there rather than overwriting it with an empty
      // string (this step's recorder shares state with that textarea).
      fd.append("text",$("f_dump")?$("f_dump").value:"");
      fd.append("files",_recBlob,filename);
      const result=await api(`/api/onboarding/${token}/brain-dump`,{method:"POST",body:fd});
      state.data.brainDump=result.data.brainDump;
      _recBlob=null; $("recPlaybackWrap").style.display="none"; $("recHint").textContent="Hold to talk";
      if(onUploaded) onUploaded(result.data.brainDump,filename);
    }catch(e){
      $("recHint").textContent="Upload failed: "+e.message;
    }finally{
      useBtn.disabled=false; useBtn.textContent="Use this recording";
    }
  };
}

function renderProgress(){
  $("progress").innerHTML=STEPS.map((s,i)=>`<i class="${i<stepIdx?'done':i===stepIdx?'now':''}"></i>`).join("");
}

function showExpired(msg){
  $("progress").style.display="none";
  $("card").innerHTML=`<div class="center-state"><div class="glyph">◇</div><h1 style="text-align:center">This link has expired</h1><p class="sub" style="text-align:center">${esc(msg||"Ask Sailz for a new setup link.")}</p></div>`;
}

async function boot(){
  try{
    state=await api(`/api/onboarding/${token}`);
  }catch(e){
    if(e.status===404||e.status===410) return showExpired(e.message);
    $("card").innerHTML=`<div class="center-state"><div class="glyph">!</div><p class="sub">Couldn't load this link right now. Try refreshing.</p></div>`;
    return;
  }
  $("brandSub").textContent=`Setting up ${state.clientName}`;
  stepIdx=Math.max(0,STEPS.indexOf(state.currentStep||"basics"));
  renderStep(stepIdx);
}

async function goTo(i){
  stepIdx=Math.max(0,Math.min(STEPS.length-1,i));
  renderStep(stepIdx);
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderStep(i){
  renderProgress();
  const step=STEPS[i];
  const renderers={basics:renderBasics,goals:renderGoals,hours:renderHours,services:renderServices,policies:renderPolicies,brainDump:renderBrainDump,voice:renderVoice,interview:renderInterview,done:renderDone};
  renderers[step]();
}

function nav(html,{back=true}={}){
  return `${html}<div class="btnbar">${back?`<button class="btn-ghost" onclick="goTo(stepIdx-1)">Back</button>`:""}<button class="btn-primary" id="nextBtn">Continue</button></div>`;
}

/* ---------------- Step 1: basics ---------------- */
function renderBasics(){
  const d=state.data.basics||{};
  $("card").innerHTML=nav(`
    <h1>The basics</h1>
    <p class="sub">Tell us about the business — this becomes your AI receptionist's home base.</p>
    <label>Business name</label><input type="text" id="f_name" value="${esc(d.businessName||"")}" placeholder="Shine Dental Clinic">
    <label>What kind of business?</label><input type="text" id="f_type" value="${esc(d.businessType||"")}" placeholder="dental, restaurant, salon…">
    <label>Owner email</label><input type="email" id="f_owner_email" value="${esc(d.ownerEmail||"")}" placeholder="you@yourbusiness.com">
    <div class="hint">Your dashboard login goes here.</div>
    <div class="row2">
      <div><label>Phone</label><input type="tel" id="f_phone" value="${esc(d.phone||"")}" placeholder="(555) 123-4567"></div>
      <div><label>Timezone</label><input type="text" id="f_tz" value="${esc(d.timezone||"America/New_York")}" placeholder="America/New_York"></div>
    </div>
    <label>Address</label><input type="text" id="f_addr" value="${esc(d.address||"")}" placeholder="1 Main St, Richmond, VA">
  `,{back:false});
  $("nextBtn").onclick=async()=>{
    const data={businessName:$("f_name").value.trim(),businessType:$("f_type").value.trim(),ownerEmail:$("f_owner_email").value.trim(),phone:$("f_phone").value.trim(),timezone:$("f_tz").value.trim()||"America/New_York",address:$("f_addr").value.trim()};
    if(!data.businessName){alert("Business name is required.");return}
    if(!data.ownerEmail||!data.ownerEmail.includes("@")){alert("A valid owner email is required — that's where your dashboard login goes.");return}
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"basics",data})});
    state.data.basics=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 2: goals ---------------- */
const GOAL_CHIPS=[
  {id:"answer_calls",label:"answer every call"},
  {id:"book_appointments",label:"book appointments/meetings"},
  {id:"take_orders",label:"take orders"},
  {id:"chase_leads",label:"chase leads fast"},
  {id:"reminders_confirmations",label:"reminders & confirmations"},
  {id:"reviews_followups",label:"reviews & follow-ups"},
  {id:"paperwork_notes",label:"paperwork/notes"},
  {id:"something_else",label:"something else"},
];
let selectedGoalChips=[];
function renderGoals(){
  const d=state.data.goals||{};
  selectedGoalChips=(d.chips||[]).slice();
  paintGoals(d);
}
function paintGoals(d){
  $("card").innerHTML=nav(`
    <h1>What should your brain take off your plate?</h1>
    <p class="sub">Pick everything that applies — this shapes which AI agents we set up for you.</p>
    <div class="gchips" id="goalChips">${GOAL_CHIPS.map(c=>`<div class="gchip${selectedGoalChips.includes(c.id)?' selected':''}" data-goal="${c.id}">${esc(c.label)}</div>`).join("")}</div>
    <div class="gchip-other-input" id="otherWrap" style="display:${selectedGoalChips.includes('something_else')?'block':'none'}">
      <input type="text" id="f_other" value="${esc(d.somethingElseText||"")}" placeholder="Tell us what else…">
    </div>
    <label>Describe a bad week at your business</label>
    <textarea id="f_badweek" placeholder="What goes wrong when things are busy or short-staffed?">${esc(d.badWeekText||"")}</textarea>
  `);
  $("goalChips").querySelectorAll(".gchip").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.goal;
      const i=selectedGoalChips.indexOf(id);
      if(i===-1) selectedGoalChips.push(id); else selectedGoalChips.splice(i,1);
      el.classList.toggle("selected");
      $("otherWrap").style.display=selectedGoalChips.includes("something_else")?"block":"none";
    };
  });
  $("nextBtn").onclick=async()=>{
    const data={chips:selectedGoalChips.slice(),somethingElseText:$("f_other")?$("f_other").value.trim():"",badWeekText:$("f_badweek").value.trim()};
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"goals",data})});
    state.data.goals=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 3: hours ---------------- */
function renderHours(){
  const d=state.data.hours||{};
  const rows=d.rows&&d.rows.length?d.rows:[{days:"Mon–Fri",open:"9:00 AM",close:"5:00 PM"},{days:"Sat",open:"",close:""},{days:"Sun",open:"",close:""}];
  $("card").innerHTML=nav(`
    <h1>Hours</h1>
    <p class="sub">When are you open? Leave open/close blank for closed days.</p>
    <div id="hoursGrid">${rows.map((r,i)=>`
      <div class="hrow">
        <span class="hd">${esc(r.days)}</span>
        <input type="text" data-open="${i}" value="${esc(r.open||"")}" placeholder="9:00 AM">
        <input type="text" data-close="${i}" value="${esc(r.close||"")}" placeholder="5:00 PM">
      </div>`).join("")}
    </div>
    <label>Holiday notes</label>
    <textarea id="f_holidays" placeholder="Closed major holidays; half day before Thanksgiving…">${esc(d.holidaysNote||"")}</textarea>
  `);
  $("nextBtn").onclick=async()=>{
    const newRows=rows.map((r,i)=>({days:r.days,open:document.querySelector(`[data-open="${i}"]`).value.trim()||null,close:document.querySelector(`[data-close="${i}"]`).value.trim()||null}));
    const data={rows:newRows,holidaysNote:$("f_holidays").value.trim()};
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"hours",data})});
    state.data.hours=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 4: services ---------------- */
let svcRows=[];
function renderServices(){
  svcRows=(state.data.services&&state.data.services.length?state.data.services:[{name:"",priceRange:"",duration:""}]).map(s=>({...s}));
  paintServices();
}
function paintServices(){
  $("card").innerHTML=nav(`
    <h1>Services</h1>
    <p class="sub">What do you offer? Add as many as you like.</p>
    <div id="svcList">${svcRows.map((s,i)=>`
      <div class="svc">
        ${svcRows.length>1?`<span class="rm" onclick="removeSvc(${i})">✕</span>`:""}
        <label>Service name</label><input type="text" data-svc-name="${i}" value="${esc(s.name)}" placeholder="Cleaning &amp; exam">
        <div class="row2">
          <div><label>Price range</label><input type="text" data-svc-price="${i}" value="${esc(s.priceRange)}" placeholder="$100–$150"></div>
          <div><label>Duration</label><input type="text" data-svc-dur="${i}" value="${esc(s.duration)}" placeholder="45 min"></div>
        </div>
      </div>`).join("")}</div>
    <div class="add-row" onclick="addSvc()">Add another service</div>
  `);
  wireSvcInputs();
  $("nextBtn").onclick=async()=>{
    syncSvcFromInputs();
    const data=svcRows.filter(s=>s.name.trim());
    if(!data.length){alert("Add at least one service.");return}
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"services",data})});
    state.data.services=data; goTo(stepIdx+1);
  };
}
function wireSvcInputs(){
  document.querySelectorAll("[data-svc-name],[data-svc-price],[data-svc-dur]").forEach(el=>{
    el.addEventListener("input",syncSvcFromInputs);
  });
}
function syncSvcFromInputs(){
  svcRows.forEach((s,i)=>{
    s.name=document.querySelector(`[data-svc-name="${i}"]`).value;
    s.priceRange=document.querySelector(`[data-svc-price="${i}"]`).value;
    s.duration=document.querySelector(`[data-svc-dur="${i}"]`).value;
  });
}
function addSvc(){ syncSvcFromInputs(); svcRows.push({name:"",priceRange:"",duration:""}); paintServices(); }
function removeSvc(i){ syncSvcFromInputs(); svcRows.splice(i,1); paintServices(); }

/* ---------------- Step 5: policies ---------------- */
function renderPolicies(){
  const d=state.data.policies||{};
  $("card").innerHTML=nav(`
    <h1>Policies &amp; insurance</h1>
    <p class="sub">The stuff your front desk gets asked every day.</p>
    <label>Insurance accepted <span style="text-transform:none;font-weight:400">(comma-separated, leave blank if none)</span></label>
    <input type="text" id="f_ins" value="${esc((d.insuranceAccepted||[]).join(', '))}" placeholder="Delta Dental, Cigna, Aetna">
    <label>Cancellation / rescheduling policy</label>
    <textarea id="f_cancel" placeholder="24-hour notice required for cancellations…">${esc(d.cancellationPolicy||"")}</textarea>
    <label>Payment options / self-pay</label>
    <textarea id="f_pay" placeholder="Cash, card, financing available…">${esc(d.paymentOptions||"")}</textarea>
  `);
  $("nextBtn").onclick=async()=>{
    const data={insuranceAccepted:$("f_ins").value.split(",").map(s=>s.trim()).filter(Boolean),cancellationPolicy:$("f_cancel").value.trim(),paymentOptions:$("f_pay").value.trim()};
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"policies",data})});
    state.data.policies=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 6: brain dump ---------------- */
let pendingFiles=[];
const FSTATUS_LABEL={parsed:"Parsed ✓",queued:"Queued",failed:"Failed"};
function renderBrainDump(){
  const d=state.data.brainDump||{};
  pendingFiles=[];
  $("card").innerHTML=`
    <h1>The brain dump</h1>
    <p class="sub">Paste ANYTHING — your price list, your FAQ doc, a photo of your menu or hours sign. Our brain will read it and figure out the rest.</p>
    <textarea class="mono" id="f_dump" placeholder="Paste anything here — pricing, FAQs, policies, how you talk to patients…">${esc(d.text||"")}</textarea>
    <div class="filepick" id="filepick">
      <input type="file" id="f_files" multiple accept=".txt,.pdf,.docx,.jpg,.jpeg,.png,.heic,.heif,.m4a,.mp3,.wav,.webm">
      <div class="fp-t">Tap to attach files</div>
      <div class="fp-s">Docs, photos, or audio — up to 20 files per batch, add more batches anytime</div>
    </div>
    <div class="filelist" id="pendingList"></div>
    <div class="filelist" id="fileList"></div>
    ${recorderHTML()}
    <div id="extractResult"></div>
    <div class="btnbar">
      <button class="btn-ghost" onclick="goTo(stepIdx-1)">Back</button>
      <button class="btn-primary" id="readBtn">Let the brain read this</button>
    </div>
    <div style="text-align:center"><button class="btn-link" id="skipDumpBtn">Skip this step</button></div>
  `;
  $("filepick").onclick=()=>$("f_files").click();
  $("f_files").onchange=()=>{
    pendingFiles=Array.from($("f_files").files).slice(0,20);
    paintPending();
  };
  $("skipDumpBtn").onclick=()=>goTo(stepIdx+1);
  $("readBtn").onclick=readBrainDump;
  paintUploaded(d.files||[]);
  wireRecorder((bd,filename)=>{ paintUploaded(bd.files||[]); appendTranscripts(bd.files,[filename]); paintExtraction(bd.extractedProfile,bd.proposedFacts); });
  if(d.extractedProfile) paintExtraction(d.extractedProfile,d.proposedFacts||[]);
}
function paintPending(){
  $("pendingList").innerHTML=pendingFiles.map((f,i)=>`
    <div class="filechip"><span class="fstatus pending">Ready</span><span class="fc-name">${esc(f.name)}</span><span class="x" onclick="removeFile(${i})">✕</span></div>
  `).join("");
}
function removeFile(i){
  pendingFiles.splice(i,1);
  paintPending();
}
function paintUploaded(files){
  $("fileList").innerHTML=files.map((f,i)=>`
    <div class="filechip">
      <span class="fstatus ${esc(f.status)}">${esc(FSTATUS_LABEL[f.status]||f.status)}</span>
      <span class="fc-name">${esc(f.name)}${f.note?`<span class="fc-note">${esc(f.note)}</span>`:""}</span>
      <span class="x" onclick="removeUploadedFile(${i})">✕</span>
    </div>
  `).join("");
}
async function removeUploadedFile(i){
  const files=(state.data.brainDump.files||[]).slice();
  files.splice(i,1);
  const data={...state.data.brainDump,files};
  await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"brainDump",data})});
  state.data.brainDump=data;
  paintUploaded(files);
}
// Surfaces any newly-transcribed audio's text directly into the visible
// brain-dump textarea ("here's what I heard — fix anything wrong") instead
// of letting it feed the extraction pipeline invisibly — matched against
// uploadedNames so a re-render/later batch never re-appends the same
// transcript twice.
function appendTranscripts(files,uploadedNames){
  const fresh=(files||[]).filter(f=>uploadedNames.includes(f.name)&&f.kind==="audio"&&f.status==="parsed"&&f.text);
  if(!fresh.length)return;
  const block=fresh.map(f=>`[Here's what I heard from "${f.name}" — fix anything wrong]\n${f.text}`).join("\n\n");
  $("f_dump").value=($("f_dump").value.trim()?$("f_dump").value.trim()+"\n\n":"")+block;
}
async function readBrainDump(){
  if(!pendingFiles.length&&!$("f_dump").value.trim()){goTo(stepIdx+1);return}
  const btn=$("readBtn"); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span>Reading…`;
  const uploadedNames=pendingFiles.map(f=>f.name);
  const fd=new FormData();
  fd.append("text",$("f_dump").value);
  pendingFiles.forEach(f=>fd.append("files",f));
  try{
    const result=await api(`/api/onboarding/${token}/brain-dump`,{method:"POST",body:fd});
    state.data.brainDump=result.data.brainDump;
    pendingFiles=[];
    $("f_files").value="";
    paintPending();
    paintUploaded(result.data.brainDump.files||[]);
    appendTranscripts(result.data.brainDump.files,uploadedNames);
    paintExtraction(result.data.brainDump.extractedProfile,result.data.brainDump.proposedFacts);
  }catch(e){
    $("extractResult").innerHTML=`<div class="err">${esc(e.message)}</div>`;
  }finally{
    btn.disabled=false; btn.textContent="Let the brain read this";
  }
}
function paintExtraction(profile,facts){
  const parts=[];
  parts.push(`<div class="extract-sec"><h1 style="font-size:18px;margin-bottom:4px">Here's what the brain understood</h1><p class="sub" style="margin-bottom:0">Review below — we'll fold this into your profile.</p></div>`);
  if(profile.services&&profile.services.length){
    parts.push(`<div class="k">Services found</div><div class="chip-list">${profile.services.map(s=>`<span class="chip">${esc(s.name)}${s.priceRange?" · "+esc(s.priceRange):""}</span>`).join("")}</div>`);
  }
  if(profile.policies&&profile.policies.length){
    parts.push(`<div class="k">Policies found</div>${profile.policies.map(p=>`<div class="fact-item">${esc(p)}</div>`).join("")}`);
  }
  if(profile.insuranceAccepted&&profile.insuranceAccepted.length){
    parts.push(`<div class="k">Insurance</div><div class="chip-list">${profile.insuranceAccepted.map(i=>`<span class="chip">${esc(i)}</span>`).join("")}</div>`);
  }
  if(facts&&facts.length){
    parts.push(`<div class="k">Other things it learned</div>${facts.map(f=>`<div class="fact-item">${esc(f.fact)}<span class="src">${esc(f.source||"brain dump")}</span></div>`).join("")}`);
  }
  if(profile.unstructuredNote){
    parts.push(`<div class="fact-item" style="color:var(--dim)">${esc(profile.unstructuredNote)}</div>`);
  }
  if(!(profile.services&&profile.services.length)&&!(profile.policies&&profile.policies.length)&&!(facts&&facts.length)){
    parts.push(`<div class="fact-item" style="color:var(--dim)">Nothing structured came out of that — no problem, you can fill in details manually in other steps.</div>`);
  }
  $("extractResult").innerHTML=parts.join("");
  $("readBtn").textContent="Read again";
  if(!document.getElementById("dumpNextBtn")){
    const bar=document.createElement("div");
    bar.className="btnbar";
    bar.innerHTML=`<button class="btn-primary" id="dumpNextBtn" style="flex:1">Looks good, continue</button>`;
    $("extractResult").after(bar);
  }
  document.getElementById("dumpNextBtn").onclick=async()=>{
    const data={text:$("f_dump").value,files:(state.data.brainDump&&state.data.brainDump.files)||[],extractedProfile:profile,proposedFacts:facts};
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"brainDump",data})});
    state.data.brainDump=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 7: voice & tone ---------------- */
function renderVoice(){
  const d=state.data.voice||{};
  $("card").innerHTML=nav(`
    <h1>Voice &amp; tone</h1>
    <p class="sub">How should your AI receptionist sound on the phone?</p>
    <label>How formal?</label>
    <select id="f_formality">
      ${["casual and warm","friendly and professional","formal and precise"].map(o=>`<option ${d.formality===o?"selected":""}>${o}</option>`).join("")}
    </select>
    <label>Greeting phrasing</label>
    <input type="text" id="f_greet" value="${esc(d.greetingPhrasing||"")}" placeholder="Thanks for calling Shine Dental, how can I help?">
    <label>Things it should never say</label>
    <textarea id="f_never" placeholder="Never guarantee insurance coverage, never diagnose over the phone…">${esc(d.neverSay||"")}</textarea>
  `);
  $("nextBtn").onclick=async()=>{
    const data={formality:$("f_formality").value,greetingPhrasing:$("f_greet").value.trim(),neverSay:$("f_never").value.trim()};
    await api(`/api/onboarding/${token}/step`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({step:"voice",data})});
    state.data.voice=data; goTo(stepIdx+1);
  };
}

/* ---------------- Step 8: interview ---------------- */
let interviewQas=[];
function renderInterview(){
  interviewQas=(state.data.interview&&state.data.interview.qas||[]).slice();
  paintInterview(true);
  fetchNextQuestion();
}
function paintInterview(loading){
  const bubbles=interviewQas.map(qa=>`<div class="bubble q">${esc(qa.q)}</div><div class="bubble a">${esc(qa.a)}</div>`).join("");
  $("card").innerHTML=`
    <h1>A few quick questions</h1>
    <p class="sub">Our brain noticed a few gaps — answer what you can, skip the rest.</p>
    <div class="qcount">${interviewQas.length} of up to 8</div>
    <div class="chat" id="chat">${bubbles}</div>
    <div id="qArea">${loading?`<div class="center-state" style="padding:20px"><span class="spinner"></span>Thinking of a question…</div>`:""}</div>
    <div class="rec-toggle" id="recToggle">🎙 Or just talk instead</div>
    <div id="recWrap" style="display:none">${recorderHTML()}</div>
    <div id="recInterviewMsg"></div>
  `;
  $("recToggle").onclick=()=>{
    const opening=$("recWrap").style.display==="none";
    $("recWrap").style.display=opening?"block":"none";
    if(opening) wireRecorder((bd,filename)=>{
      const f=(bd.files||[]).find(x=>x.name===filename);
      const heard=f&&f.kind==="audio"&&f.status==="parsed"&&f.text
        ?`<p class="sub" style="margin:10px 0 0"><strong style="color:var(--ink)">Here's what I heard:</strong> "${esc(f.text)}"</p>`:"";
      $("recInterviewMsg").innerHTML=`<p class="sub" style="margin:10px 0 0;text-align:center">Got it — added to what your brain knows.</p>${heard}`;
    });
  };
}
async function fetchNextQuestion(){
  let result;
  try{
    result=await api(`/api/onboarding/${token}/interview/next`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({answers:interviewQas})});
  }catch(e){
    $("qArea").innerHTML=`<div class="err">${esc(e.message)}</div><div class="btnbar"><button class="btn-primary" id="finishInterviewBtn" style="flex:1">Continue</button></div>`;
    document.getElementById("finishInterviewBtn").onclick=()=>goTo(stepIdx+1);
    return;
  }
  state.data.interview={qas:interviewQas};
  if(result.done){ paintDoneWithInterview(); return; }
  paintQuestion(result.question);
}
function paintQuestion(question){
  $("qArea").innerHTML=`
    <div class="bubble q">${esc(question)}</div>
    <textarea id="f_answer" placeholder="Type your answer…" style="min-height:70px;margin-top:10px"></textarea>
    <div class="btnbar">
      <button class="btn-ghost" id="skipQBtn">Skip</button>
      <button class="btn-primary" id="answerBtn">Send</button>
    </div>
  `;
  $("skipQBtn").onclick=()=>goTo(stepIdx+1);
  $("answerBtn").onclick=async()=>{
    const a=$("f_answer").value.trim();
    if(!a){goTo(stepIdx+1);return}
    interviewQas.push({q:question,a});
    paintInterview(true);
    fetchNextQuestion();
  };
}
function paintDoneWithInterview(){
  $("qArea").innerHTML=`<p class="sub" style="text-align:center;margin-top:14px">That's everything we needed to ask.</p><div class="btnbar"><button class="btn-primary" id="finishInterviewBtn" style="flex:1">Continue</button></div>`;
  document.getElementById("finishInterviewBtn").onclick=()=>goTo(stepIdx+1);
}

/* ---------------- Step 9: done ---------------- */
async function renderDone(){
  $("card").innerHTML=`<div class="center-state"><span class="spinner"></span>Preparing your brain…</div>`;
  let result;
  try{
    result=await api(`/api/onboarding/${token}/complete`,{method:"POST"});
  }catch(e){
    if(e.status!==410){ $("card").innerHTML=`<div class="center-state"><div class="glyph">!</div><p class="sub">${esc(e.message)}</p></div>`; return; }
    // 410 = already completed on a prior visit to this step — fine, fall through to the confirmation view below (no tenant/bootstrap info on a re-visit, so this always shows the "Sailz is reviewing" copy in that case)
  }
  $("progress").innerHTML=STEPS.map(()=>`<i class="done"></i>`).join("");
  // Multi-tenant mode: the dashboard already exists — redirect straight
  // into it, signed in, instead of making them wait for a human. The
  // bootstrap token is single-purpose and expires in 10 minutes; the
  // platform's own index.html exchanges it for a real session on load.
  if(result?.tenant?.redirectUrl){
    $("card").innerHTML=`
      <div class="center-state">
        <div class="glyph">✦</div>
        <h1>Your brain is ready</h1>
        <p class="sub">Taking you to your dashboard now…</p>
      </div>
    `;
    location.href=result.tenant.redirectUrl;
    return;
  }
  $("card").innerHTML=`
    <div class="center-state">
      <div class="glyph">✦</div>
      <h1>Your brain is being prepared</h1>
      <p class="sub">Sailz is reviewing everything you shared. Once it's approved, your AI phone line goes live and starts answering calls with everything you just taught it.</p>
      <ul class="done-list">
        <li>— A Sailz team member reviews your setup for accuracy</li>
        <li>— Your brain gets activated with everything you shared</li>
        <li>— We'll reach out with your login and next steps</li>
      </ul>
    </div>
  `;
}

boot();
</script>
</body>
</html>
